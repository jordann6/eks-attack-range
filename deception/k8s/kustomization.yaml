apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deception layer (ADR-0005). Applied by `make decoys` after `make app`.
# Two decoys are NOT here on purpose, because they carry secret values that must
# never be committed: the D1 AWS key Secret (backup-sync-aws, minted by
# `aws iam create-access-key`) and the D3 Secret (prod-db-backup-creds, random
# values). `make decoys` creates both imperatively.
#
# No name in the cluster says decoy or honey. An attacker with the stolen
# cluster-admin token can read every object here.
resources:
  - backup-operator.yaml
  - quarantine-policy.yaml
  - responder.yaml
