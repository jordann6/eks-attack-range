apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarizer
  namespace: summarizer
  labels:
    app: summarizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summarizer
  template:
    metadata:
      labels:
        app: summarizer
    spec:
      serviceAccountName: summarizer
      containers:
        - name: summarizer
          # Replaced with the ECR image by `make deploy` (kustomize edit set image).
          image: summarizer:lab
          ports:
            - containerPort: 8000
          env:
            # WEAKNESS 1: the trophy token is injected from a plaintext Secret as
            # a plain environment variable. Visible in `kubectl get pod -o yaml`,
            # in the Secret, and to anything with RCE in the container. The value
            # is a synthetic per-run canary, accepted only by the lab receiver.
            - name: CANARY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: summarizer-key
                  key: CANARY_TOKEN
          # No securityContext on purpose: runs as root, privilege escalation
          # allowed, root filesystem writable. The hardened overlay drops all
          # capabilities, runs non-root, and sets readOnlyRootFilesystem: true.
          # D1 (ADR-0005): the file an intruder looks for first. The Secret holds
          # a real access key on a zero-policy IAM user, minted by `make decoys`
          # and never committed. optional: true, so the app deploys the same with
          # or without the deception layer. Any API call signed with this key is
          # caught from CloudTrail and quarantines the pod that mounts it.
          volumeMounts:
            - name: aws-credentials
              mountPath: /root/.aws
              readOnly: true
      volumes:
        - name: aws-credentials
          secret:
            secretName: backup-sync-aws
            optional: true
