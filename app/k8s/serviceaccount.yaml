apiVersion: v1
kind: ServiceAccount
metadata:
  name: summarizer
  namespace: summarizer
# WEAKNESS: the token is auto-mounted into the pod (the default). Combined with
# the over-permissive binding in rbac.yaml, RCE in the pod hands the attacker a
# cluster-admin token at /var/run/secrets/kubernetes.io/serviceaccount/token.
# The hardened overlay sets automountServiceAccountToken: false and only mounts
# a projected token where a workload genuinely needs the API.
automountServiceAccountToken: true
