apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Secret is intentionally NOT listed here so no token is ever committed.
# `make app` creates it imperatively from a synthetic per-run canary token:
#   kubectl -n summarizer create secret generic summarizer-key \
#     --from-literal=CANARY_TOKEN=$CANARY_TOKEN
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - receiver.yaml
